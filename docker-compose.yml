# Runs the published image. From a clone of the repository, docker-compose.override.yml builds from source instead.
name: housekeeping

services:
  housekeeping:
    image: ghcr.io/christhoma/housekeeping:${HOUSEKEEPING_VERSION:-latest}
    container_name: housekeeping
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - housekeeping-data:/data

volumes:
  housekeeping-data:
