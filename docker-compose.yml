# Runs the published image. From a clone of the repository, docker-compose.override.yml builds from source instead.
name: housekeeping

services:
  housekeeping:
    image: ghcr.io/christhoma/housekeeping:${HOUSEKEEPING_VERSION:-latest}
    container_name: housekeeping
    restart: unless-stopped
    ports:
      # Only this computer can reach it by default. To open it to your network, set HOST=0.0.0.0
      # in .env, and set HOUSEKEEPING_PASSWORD too.
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - housekeeping-data:/data

volumes:
  housekeeping-data:
