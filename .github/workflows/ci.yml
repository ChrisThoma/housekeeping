name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*
      # 3.12 tests the exact versions the image ships; 3.10 tests the ranges in requirements.txt.
      - run: pip install -r requirements-dev.txt ${{ matrix.python == '3.12' && '-c requirements.lock' || '' }}
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t housekeeping:ci .
      - name: Start and check health
        run: |
          docker run -d --name hk -p 8000:8000 housekeeping:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          docker logs hk; exit 1
