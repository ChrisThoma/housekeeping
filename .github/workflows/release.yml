name: Release

# Pushing a tag like v0.2.0 runs the tests, then publishes ghcr.io/<owner>/<repo>:0.2.0 and :0.2 for amd64 and
# arm64, and creates a GitHub release. The tag must match __version__ in app/__init__.py.
# :latest moves only for the highest stable version, so a backport like v0.1.2 after v0.2.0 doesn't take it.
# Tags with a hyphen (v0.3.0-rc.1) are prereleases: no :latest or :major.minor, and the release is marked as one.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      prerelease: ${{ steps.latest.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the app version
        run: |
          version=$(python -c "import app; print(app.__version__)")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match app version $version"; exit 1; }
      - id: latest
        name: Is this the newest stable version?
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          newest=$(git tag -l 'v*' | grep -v -- - | sort -V | tail -n 1)
          [ "$prerelease" = false ] && [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true || latest=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease latest=$latest (newest stable tag: $newest)"
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest -q

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push the image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.check.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Housekeeping
            org.opencontainers.image.description=A self-hosted home maintenance planner
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags="--generate-notes --verify-tag"
          [ "${{ needs.check.outputs.prerelease }}" = true ] && flags="$flags --prerelease"
          [ "${{ needs.check.outputs.latest }}" = true ] || flags="$flags --latest=false"
          gh release create "$GITHUB_REF_NAME" $flags
